server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # los archivos de idioma y el código cambian con cada versión: no se guardan en caché mucho tiempo
    location ~* \.(js|css|json)$ {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(png|jpg|svg|ico|webp)$ {
        expires 7d;
    }
}
